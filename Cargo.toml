# The Rust workspace: toolchain/ is the Kern toolchain (crate `kern`, binary `kern`; docs/research/RUST_PORT_PLAN.md),
# runtime/ is kern-rt, linked into every compiled Kern program. build/ holds generated crates that path-depend on
# runtime/, so it stays out of the workspace.
[workspace]
members = ["toolchain", "runtime"]
exclude = ["build"]
resolver = "2"
