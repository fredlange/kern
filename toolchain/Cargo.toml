[package]
name = "kern"
version = "0.1.0"
edition = "2021"
description = "A language for agent-written code: machine-checked specs and a generated proof page"

[lib]
name = "kern"
path = "src/lib.rs"

[[bin]]
name = "kern"
path = "src/main.rs"

# Crate-wide rule: no std HashMap/HashSet where iteration order can reach terms, mutants or output (FZ finding 6).
# IndexMap keeps Python dict order; BTreeMap where sorted order is wanted.
[dependencies]
indexmap = "2"
regex = "1"
sha2 = "0.10"
# Z3 5.3.3, the version Python's z3-solver bundles (docs/research/RUST_PORT_PLAN.md). z3-sys for the few terms the
# crate builds differently from z3py (quantifier weight/qid/skid), so the solver sees the same input.
z3 = "0.22"
z3-sys = "0.14"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# the host (kern host): SQLite (bundled, so no system library), an HTTP server and client
rusqlite = { version = "0.32", features = ["bundled", "trace"] }
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# token counts for views (Python: the optional `tokens` extra); pure Rust (fancy-regex, no oniguruma)
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = ["tokens"]
tokens = ["dep:tokenizers"]
# Z3 5.3.3 compiled from source and linked statically (z3-src 503.3.0; needs cmake and a C++ compiler). The
# Docker image uses it, since distribution libz3 packages aren't 5.3.3. Default: the system libz3 via pkg-config.
static-z3 = ["z3/bundled"]
# Known prover bugs that the soundness fuzzer must find (validation/src/fuzz.rs --fault a|b|c): compiled in
# only with this feature, and inert unless KERN_FAULT names one. Only kern-validation enables it, so only
# `cargo build --workspace` (resolver 2 unifies features across members) compiles it into the kern binary.
# What ships never does: `cargo install --path toolchain` and the Dockerfile's `cargo build -p kern`.
faults = []

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }   # float_roundtrip: exact float parsing (pyrandom vectors)
