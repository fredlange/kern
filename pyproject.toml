# What ships: the `kern` Python package (toolchain: parse, check, prove, views, proof page, host, MCP
# server, Rust emitter). The Rust runtime crate is runtime/ (its own Cargo.toml). Everything else in
# the repository (examples/, tests/, validation/, experiments/, docs/research/) is not part of it.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kern"
version = "0.1.0"
description = "A language for agent-written code: machine-checked specs and a generated proof page"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["z3-solver"]

[project.optional-dependencies]
tokens = ["tokenizers", "anthropic==0.34.2"]   # token counts in `view`
dev = ["pytest"]

[project.scripts]
kern = "kern.__main__:main"

[tool.setuptools]
packages = ["kern"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
