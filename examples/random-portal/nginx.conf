server {
  listen 8000;
  root /srv/www;

  # The React build and the proof page generated at image build time.
  location / { try_files $uri /index.html; }

  # Reply definitions are called by the host when an HTTP reply arrives, never by visitors.
  # Kern can't express "only the net path may call this" yet, so the proxy is what keeps them out.
  location ~ ^/api/(store|store_joke|store_pun|fetch_failed)$ { return 403; }

  # The Kern host: POST /NAME runs a proven definition, GET /state and /manifest read.
  location /api/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_set_header Host $host;
  }
}
